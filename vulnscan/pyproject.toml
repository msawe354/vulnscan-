[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "1.0.0"
description = "Educational web vulnerability scanner (headers, exposed paths, reflected XSS) with a rich CLI report"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["security", "scanner", "pentest", "xss", "appsec", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "typer>=0.12,<0.16",
    "rich>=13.7,<14",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "respx>=0.21,<0.23",
]

[project.scripts]
vulnscan = "vulnscan.cli:app"

[project.urls]
Homepage = "https://github.com/your-username/vulnscan"
Issues = "https://github.com/your-username/vulnscan/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnscan = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# B008: Typer требует вызов typer.Option(...) в значениях по умолчанию.
# RUF001/RUF002/RUF003: проект на русском языке, кириллица ожидаема.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
